version: "3.8"

services:
  bridge:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - WEBHOOK_URL=${WEBHOOK_URL:-http://consumer:8080/notify}
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1,consumer}
    volumes:
      - ./data:/data

  consumer:
    build:
      context: ./consumer
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1}
    volumes:
      - ./consumer_data:/data
    ports:
      - "8080:8080"
